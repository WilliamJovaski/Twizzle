<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 1200" fill="none">
  <defs>
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF9500" flood-opacity="0.65"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22C55E" flood-opacity="0.55"/>
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#020817" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- 1. White Dashed Twizzle Sweep Arc (traces from ice up through the extended left skate) -->
  <path d="M 380 1125 C 210 1095, 95 985, 76 855 C 66 790, 78 725, 102 670"
        stroke="#FFFFFF"
        stroke-width="2.6"
        stroke-dasharray="9 8"
        stroke-linecap="round"
        opacity="0.92" />

  <!-- Subtle trajectory endpoint node -->
  <circle cx="102" cy="670" r="4" fill="#FFFFFF" opacity="0.9" />

  <!-- 2. Orange Twizzle Rotation Ring Around Waist/Torso (waist x=448..579, y=465) -->
  <!-- Back half of ring (behind torso, dashed & softer) -->
  <path d="M 412 458 A 110 28 0 0 1 620 458"
        stroke="#FF9500"
        stroke-width="2.2"
        stroke-dasharray="5 5"
        opacity="0.42" />

  <!-- Front half of ring (in front of torso, solid glowing orange with arrowhead) -->
  <path d="M 412 458 A 110 28 0 0 0 614 466"
        stroke="#FF9500"
        stroke-width="3.2"
        stroke-linecap="round"
        filter="url(#glowOrange)" />

  <!-- Orange Arrowhead -->
  <polygon points="624,462 606,457 611,474" fill="#FF9500" filter="url(#glowOrange)" />

  <!-- Rotation Metric Text -->
  <g filter="url(#textShadow)" font-family="'Inter', 'Segoe UI', sans-serif">
    <text x="642" y="464" fill="#FF9F1C" font-size="25" font-weight="600" letter-spacing="-0.3">3.5 turns</text>
    <text x="664" y="488" fill="#E2E8F0" font-size="13.5" font-weight="400" opacity="0.9">Twizzle Spin</text>
  </g>

  <!-- 3. Blue Leg Extension Angle Indicator (Between extended leg and standing leg) -->
  <g filter="url(#glowBlue)">
    <!-- Angle Vertex Lines -->
    <path d="M 358 948 L 322 1008 L 408 1008"
          stroke="#2997FF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <!-- Inner Angle Arc -->
    <path d="M 340 978 A 34 34 0 0 1 356 1008"
          stroke="#2997FF"
          stroke-width="2"
          fill="#2997FF"
          fill-opacity="0.18" />
  </g>
  <g filter="url(#textShadow)" font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="374" y="998" fill="#2997FF" font-size="25" font-weight="600">132°</text>
    <text x="371" y="1030" fill="#E2E8F0" font-size="13.5" font-weight="400" opacity="0.9">Extension</text>
  </g>

  <!-- 4. Green Vertical Axis / Elevation Indicator (Right of Standing Leg) -->
  <g filter="url(#glowGreen)">
    <line x1="606" y1="815" x2="606" y2="1102"
          stroke="#22C55E"
          stroke-width="2.4" />
    <!-- Top Arrowhead -->
    <path d="M 599 826 L 606 812 L 613 826"
          stroke="#22C55E"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <!-- Bottom Baseline Tick -->
    <line x1="596" y1="1102" x2="616" y2="1102"
          stroke="#22C55E"
          stroke-width="2.4"
          stroke-linecap="round" />
  </g>
  <g filter="url(#textShadow)" font-family="'Inter', 'Segoe UI', sans-serif">
    <text x="624" y="958" fill="#22C55E" font-size="25" font-weight="600">48.5 cm</text>
    <text x="632" y="984" fill="#E2E8F0" font-size="13.5" font-weight="400" opacity="0.9">Free Leg Lift</text>
  </g>
</svg>
