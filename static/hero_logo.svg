<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" fill="none">
  <defs>
    <linearGradient id="ribbonMain" x1="150" y1="80" x2="650" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.88" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ribbonAccent" x1="580" y1="180" x2="260" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Cyan Orb (Upper Right, matching Athlitix hero aesthetic) -->
  <circle cx="620" cy="115" r="78" fill="url(#orbGlow)" filter="url(#softGlow)" />
  <circle cx="620" cy="115" r="54" fill="#00C8FF" fill-opacity="0.85" />

  <!-- Geometric Ribbon Backdrop (Dynamic Twizzle / RinkUp Angular Emblem) -->
  <path d="M210 60 H425 L575 340 C600 388 585 445 535 470 L395 540 L205 960 H55 L285 475 C305 432 285 385 240 365 L140 320 L210 60 Z"
        fill="url(#ribbonMain)" />

  <!-- Right Diagonal Wing -->
  <path d="M455 510 L585 445 L805 960 H630 L455 510 Z"
        fill="url(#ribbonAccent)" />
</svg>
